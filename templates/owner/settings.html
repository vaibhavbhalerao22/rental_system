{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card p-4">
      <h4 class="fw-bold mb-4"><i class="bi bi-sliders text-warning me-2"></i>Shop Settings</h4>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Shop Name</label>
          <input type="text" class="form-control" name="shop_name" value="{{ shop.shop_name }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Tagline</label>
          <input type="text" class="form-control" name="tagline" value="{{ shop.tagline }}">
        </div>
        <div class="mb-3">
          <label class="form-label">Address</label>
          <input type="text" class="form-control" name="address" value="{{ shop.address }}">
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Phone</label>
            <input type="text" class="form-control" name="phone" value="{{ shop.phone }}">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">GST Number (optional)</label>
            <input type="text" class="form-control" name="gst_no" value="{{ shop.gst_no }}">
          </div>
        </div>
        <button class="btn btn-brand w-100 py-2" type="submit"><i class="bi bi-check2-circle me-1"></i>Save Settings</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
